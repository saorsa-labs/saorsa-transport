[workspace]
members = [
    ".",
    "saorsa-transport-workspace-hack",
]

[package]
name = "saorsa-transport"
version = "0.36.3"
edition = "2024"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
autobins = false
repository = "https://github.com/WithAutonomi/saorsa-transport"
description = "QUIC transport protocol with advanced NAT traversal for P2P networks"
keywords = ["quic", "nat-traversal", "p2p", "autonomi", "networking"]
categories = ["network-programming", "asynchronous"]
exclude = [
    ".github/",
    ".githooks/",
    ".serena/",
    ".codecov.yml",
    ".DS_Store",
    "*.DS_Store",
    "release-build/",
    "docs/rfcs/*.pdf",
    "docs/diagrams/",
    "docs/planning/",
    "target/",
    "scripts/",
    "tests/data/large_files/",
    "benches/",
    "examples/chat_demo.rs",
    "examples/dashboard_demo.rs",
    "examples/simple_chat.rs",
    "examples/nat_simulation.rs",
]

[features]
# Default features include essential functionality with 100% PQC support
# v0.15.0: Simplified feature flags - crypto is always enabled
default = ["native", "platform-verifier", "network-discovery", "upnp"]

# Native QUIC, sockets, OS integration, and background runtime.
# Address parsing and transport capability descriptions remain portable.
native = [
    "dep:async-trait",
    "dep:bytes",
    "dep:enum_dispatch",
    "dep:rustc-hash",
    "dep:rand",
    "dep:thiserror",
    "dep:tinyvec",
    "dep:tracing",
    "dep:serde",
    "dep:serde_json",
    "dep:serde_yaml",
    "dep:x25519-dalek",
    "dep:saorsa-pqc",
    "saorsa-pqc/simd",
    "dep:slab",
    "dep:indexmap",
    "dep:lru-slab",
    "dep:dirs",
    "dep:keyring",
    "dep:rustls",
    "dep:aws-lc-rs",
    "dep:rustls-post-quantum",
    "dep:rcgen",
    "dep:tokio-util",
    "dep:futures-util",
    "dep:time",
    "dep:rustls-pemfile",
    "dep:uuid",
    "dep:unicode-width",
    "dep:hex",
    "dep:blake3",
    "dep:once_cell",
    "dep:dashmap",
    "dep:parking_lot",
    "dep:zeroize",
    "dep:clap",
    "dep:reqwest",
    "dep:tokio",
    "dep:tracing-subscriber",
    "dep:quinn-udp",
    "dep:pin-project-lite",
    "dep:regex",
    "dep:chrono",
    "dep:rustls-native-certs",
]

# Platform-specific certificate verification
platform-verifier = ["native", "dep:rustls-platform-verifier"]

# UPnP IGD port mapping for best-effort NAT traversal assistance.
# When enabled, the endpoint will opportunistically request a UDP port
# mapping from a local Internet Gateway Device. Failure is silent and
# non-fatal — the endpoint behaves identically to a non-UPnP build when
# no gateway is available.
upnp = ["native", "dep:igd-next"]

# Configure `tracing` to log events via `log` if no `tracing` subscriber exists
log = ["tracing/log"]

# Enhanced network interface discovery
network-discovery = ["native", "dep:socket2", "dep:nix"]

# Fuzzing/testing features
arbitrary = ["dep:arbitrary"]

# Internal QUIC logging
__qlog = ["dep:qlog"]

# Zero-cost tracing system
trace = []
trace-full = ["trace"]

# Enhanced testing features
property_testing = ["dep:proptest", "dep:proptest-derive"]
fuzzing = ["arbitrary"]

# BLE transport support (Linux and macOS)
# Enables Bluetooth Low Energy transport for short-range P2P
# - Linux: Uses BlueZ via bluer crate
# - macOS: Uses Core Bluetooth via btleplug crate
ble = ["native", "dep:btleplug"]

# Signaling-free WebRTC DataChannel listener for direct browser clients.
# The feature is optional so QUIC-only users do not pull in ICE/DTLS/SCTP.
webrtc-direct = ["native", "webrtc", "dep:stun", "dep:webrtc-stack", "dep:webrtc-rcgen", "dep:x509-parser"]

# Shared browser/native wire profile and post-quantum application session.
# Does not enable the native QUIC or WebRTC socket runtimes.
webrtc = [
    "dep:saorsa-pqc", "dep:blake3", "dep:chacha20poly1305", "dep:hex",
    "dep:serde", "dep:serde_bytes", "dep:serde_json",
    "dep:thiserror", "dep:zeroize",
]

[dependencies]
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"], optional = true }
serde_bytes = { version = "0.11", optional = true }
# Core dependencies
async-trait = { version = "0.1", optional = true }
base64 = "0.22"
bytes = { version = ">=1.11.1", optional = true }
enum_dispatch = { version = "0.3", optional = true }
rustc-hash = { version = "2", optional = true }
rand = { version = "0.8", optional = true }
thiserror = { version = "2.0.3", optional = true }
tinyvec = { version = "1.1", features = ["alloc"], optional = true }
tracing = { version = "0.1.10", default-features = false, features = ["std", "attributes", "log"], optional = true }

serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
serde_yaml = { version = "0.9", optional = true }
# Ed25519 removed in v0.2.0+ - Pure PQC uses ML-DSA-65 only
x25519-dalek = { version = "2.0", features = ["static_secrets"], optional = true }

# Post-Quantum Cryptography - required in v0.12.0+
saorsa-pqc = { version = "0.5", git = "https://github.com/saorsa-labs/saorsa-pqc", rev = "6d57e9dd73d537182fe85b0050e809a224f21154", default-features = false, optional = true }

# Data structures
slab = { version = "0.4.11", optional = true }
indexmap = { version = "2.0", optional = true }

lru-slab = { version = "0.1.2", optional = true }

# Bootstrap cache dependencies
dirs = { version = "6.0", optional = true }

# Platform keychain/keyring for secure credential storage
keyring = { version = "3", optional = true }

# Crypto dependencies (required for PQC)
rustls = { version = "0.23.35", default-features = false, features = ["std", "aws-lc-rs"], optional = true }
aws-lc-rs = { version = "1.12", default-features = false, features = ["unstable", "aws-lc-sys", "prebuilt-nasm"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
# PQC crypto - required in v0.12.0+
# v0.2: aws-lc-rs-unstable enables ML-DSA-65 signatures
rustls-post-quantum = { version = "0.2", features = ["aws-lc-rs-unstable"], optional = true }

# Network discovery dependencies (optional)
socket2 = { version = "0.6", optional = true, features = ["all"] }
nix = { version = "0.31", features = ["resource", "net"], optional = true }

# UPnP IGD port mapping (optional)
# Used by the `upnp` feature for best-effort UDP port mapping. The
# implementation never blocks startup and silently degrades when the
# router does not support or has disabled UPnP IGD.
igd-next = { version = "0.17", default-features = false, features = ["aio_tokio"], optional = true }

# BLE transport dependencies (cross-platform, optional)
# btleplug supports Linux (BlueZ), macOS (Core Bluetooth), and Windows (WinRT)
btleplug = { version = "0.11", optional = true }

# Essential dependencies (formerly production-ready)
rcgen = { version = "0.14" , optional = true }
tokio-util = { version = "0.7" , optional = true }
futures-util = { version = "0.3" , optional = true }

# Browser transport primitives. Saorsa owns the transport API and wire
# profile; these crates provide the standardized ICE/DTLS/SCTP machinery.
stun = { version = "0.7", optional = true }
webrtc-stack = { package = "webrtc", version = "0.14", features = ["pem"], optional = true }
webrtc-rcgen = { package = "rcgen", version = "0.13", optional = true }
x509-parser = { version = "0.18", optional = true }

time = { version = "0.3.47" , optional = true }
rustls-pemfile = { version = "2.0" , optional = true }

# Feature-specific dependencies (optional)
arbitrary = { version = "1.3", optional = true, features = ["derive"] }
qlog = { version = "0.13", optional = true }

# Essential dependencies
uuid = { version = "1.0", features = ["v4", "serde"], optional = true }
unicode-width = { version = "=0.2.2", optional = true } # Pinned to match ratatui
hex = { version = "0.4", optional = true }
blake3 = { version = "1", optional = true }
once_cell = { version = "1.21", optional = true }
dashmap = { version = "6", optional = true }
# Faster mutexes that don't poison and have fair locking
parking_lot = { version = "0.12", optional = true }
zeroize = { version = "1.8", features = ["derive"], optional = true }
proptest = { version = "1.5", features = ["std"], optional = true }
proptest-derive = { version = "0.8", optional = true }

# criterion moved to dev-dependencies for benchmarks

# Dependencies for saorsa-transport binary
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
tokio = { version = "1.28.1", features = ["full"], optional = true }
tracing-subscriber = { version = "0.3.0", default-features = false, features = ["env-filter", "fmt", "ansi", "time", "local-time", "json"], optional = true }
quinn-udp = { version = "0.6", features = ["tracing", "tracing-log"], optional = true }
pin-project-lite = { version = "0.2", optional = true }

# Compliance validator dependencies
regex = { version = "1.11", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }

# Platform-specific target dependencies
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Note: Using raw libc netlink sockets instead of netlink-packet crates
# to avoid transitive dependency on unmaintained 'paste' crate
hex = "0.4"
[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.7"
core-foundation = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
saorsa-transport-workspace-hack = { path = "saorsa-transport-workspace-hack" }
assert_matches = "1.1"
hex-literal = "1.1"
rand_pcg = "0.3"
rcgen = "0.14"
tracing-subscriber = { version = "0.3.0", default-features = false, features = ["env-filter", "fmt", "ansi", "time", "local-time", "json"] }
tempfile = "3"
lazy_static = "1"
anyhow = "1"
serde_yaml = "0.9"
serde_json = "1"
webpki-roots = "1.0"
tokio = { version = "1.36", features = ["full"] }
quickcheck = "1.0"
quickcheck_macros = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = { version = "1.5", features = ["std"] }
proptest-derive = { version = "0.8" }

# Enhanced testing dependencies
# cargo-mutants is a CLI tool, not a library dependency
# Install with: cargo install cargo-mutants
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)', 'cfg(wasm_browser)', 'cfg(feature, values("arbitrary", "__qlog"))'] }

# Main P2P binary with NAT traversal support
[[bin]]
required-features = ["native"]
name = "saorsa-transport"
path = "src/bin/saorsa-transport.rs"

# Interoperability test runner
[[bin]]
required-features = ["native"]
name = "interop-test"
path = "src/bin/interop-test.rs"

# Public endpoint tester
[[bin]]
required-features = ["native"]
name = "test-public-endpoints"
path = "src/bin/test_public_endpoints.rs"

# E2E test node with metrics push and data verification
[[bin]]
required-features = ["native"]
name = "e2e-test-node"
path = "src/bin/e2e-test-node.rs"

# Benchmarks
[[bench]]
name = "quic_benchmarks"
harness = false

[[bench]]
name = "relay_queue"
harness = false

[[bench]]
name = "candidate_discovery"
harness = false

[[bench]]
name = "nat_traversal"
harness = false

[[bench]]
name = "address_discovery_bench"
harness = false

[[bench]]
name = "connection_management"
harness = false

[[bench]]
name = "nat_traversal_performance"
harness = false

[[bench]]
name = "connection_router"
harness = false

[[bench]]
name = "pqc_memory_pool_bench"
harness = false

[[bench]]
name = "udp_throughput"
harness = false


# Test categorization
[[test]]
name = "quick"
path = "tests/quick/main.rs"

[[test]]
name = "standard"
path = "tests/standard/main.rs"

[[test]]
name = "long"
path = "tests/long/main.rs"

[[test]]
name = "property_tests"
path = "tests/property_tests/main.rs"

[package.metadata.docs.rs]
features = ["platform-verifier", "log"]

# cargo-machete false positives: these are optional/feature-gated dependencies
[package.metadata.cargo-machete]
ignored = ["proptest-derive", "x25519-dalek"]

 # Realistic clippy configuration - focus on meaningful issues
 [lints.clippy]
 # Deny unwrap/expect in production code - tests can use #[allow(clippy::unwrap_used)]
 unwrap_used = { level = "deny", priority = 1 }
 expect_used = { level = "deny", priority = 1 }

# Allow indexing - often used for accessing known-good indices in hot paths
indexing_slicing = { level = "allow", priority = 2 }

# Allow arithmetic operations - performance-critical networking code often needs this
arithmetic_side_effects = { level = "allow", priority = 2 }

# Keep these enabled for safety and correctness
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 1 }
suspicious = { level = "warn", priority = 0 }
complexity = { level = "warn", priority = 0 }
perf = { level = "warn", priority = 0 }

# Disable overly pedantic lints
pedantic = { level = "allow", priority = -1 }
restriction = { level = "allow", priority = -1 }

# Selectively enable some useful pedantic lints, but allow exceptions
must_use_candidate = { level = "allow", priority = 2 }  # Too noisy for test constructors
missing_errors_doc = { level = "allow", priority = 2 }  # Too noisy for internal APIs
missing_panics_doc = { level = "allow", priority = 2 }  # Too noisy for test code
module_name_repetitions = { level = "allow", priority = 2 }  # Common in networking protocols

# Allow print statements in examples and test utilities
print_stdout = { level = "allow", priority = 2 }
print_stderr = { level = "allow", priority = 2 }

# Allow enum variant names that end with Error - common pattern for error types
enum_variant_names = { level = "allow", priority = 2 }

# Allow reasonable nesting in complex state machines and protocol handlers
excessive_nesting = { level = "allow", priority = 2 }

# Release profile - disable debug info to fix Windows linker LNK1318 error
# This error occurs when PDB files exceed limits on Windows CI
[profile.release]
debug = false
strip = "symbols"
# Completely disable debug info to prevent PDB generation on Windows
# Without this, the linker still creates PDB files which can exceed limits
split-debuginfo = "off"
# Use LTO to reduce binary size and avoid PDB size issues
lto = "thin"

# Patch crates.io dependencies to use local version
[patch.crates-io]
saorsa-transport = { path = "." }
